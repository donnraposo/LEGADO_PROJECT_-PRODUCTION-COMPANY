[build-system]
requires = ["setuptools>=80,<81"]
build-backend = "setuptools.build_meta"

[project]
name = "legado-agent"
version = "0.1.1"
description = "Agente local Windows da plataforma LEGADO"
requires-python = ">=3.14,<3.15"
dependencies = [
    "PySide6==6.11.1",
    "httpx>=0.28,<1",
]

[project.optional-dependencies]
dev = [
    "pytest>=9,<10",
    "ruff>=0.12,<1",
]
packaging = [
    "pyinstaller>=6,<7",
]

[project.scripts]
legado-agent = "legado_agent.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM"]
