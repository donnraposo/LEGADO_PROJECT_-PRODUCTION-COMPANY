openapi: 3.1.0
info:
  title: Gerenciador de Áudio Visual API
  version: 0.1.0
  description: Contrato da API central do Gerenciador de Áudio Visual.
servers:
  - url: /
security:
  - keycloak: []
paths:
  /api/v1/drive/account:
    get:
      operationId: getDriveAccount
      summary: Consulta a conexão Google Drive da empresa
      parameters:
        - $ref: "#/components/parameters/CompanyId"
      responses:
        "200":
          description: Estado da conexão
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DriveAccount"
    delete:
      operationId: disconnectDriveAccount
      summary: Desconecta a conta Google Drive da empresa como Proprietário
      parameters:
        - $ref: "#/components/parameters/CompanyId"
      responses:
        "204":
          description: Conta desconectada
  /api/v1/drive/oauth/authorization:
    post:
      operationId: startDriveAuthorization
      summary: Inicia a autorização Google como Proprietário
      parameters:
        - $ref: "#/components/parameters/CompanyId"
      responses:
        "200":
          description: URL oficial de autorização do Google
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DriveAuthorization"
        "503":
          description: Credenciais OAuth ainda não configuradas
  /api/v1/drive/oauth/callback:
    get:
      operationId: completeDriveAuthorization
      summary: Recebe o retorno de autorização do Google
      security: []
      parameters:
        - name: code
          in: query
          schema: {type: string}
        - name: state
          in: query
          schema: {type: string}
        - name: error
          in: query
          schema: {type: string}
      responses:
        "302":
          description: Retorno ao frontend com resultado sem credenciais
  /api/v1/audit-events:
    get:
      operationId: listAuditEvents
      summary: Lista eventos imutáveis da empresa para Proprietários
      parameters:
        - $ref: "#/components/parameters/CompanyId"
      responses:
        "200":
          description: Eventos de auditoria da empresa
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuditEventCollection"
  /api/v1/invitations:
    get:
      operationId: listInvitations
      summary: Lista convites da empresa para Proprietários
      parameters:
        - $ref: "#/components/parameters/CompanyId"
      responses:
        "200":
          description: Convites da empresa
    post:
      operationId: createInvitation
      summary: Cria um convite de uso único válido por sete dias
      parameters:
        - $ref: "#/components/parameters/CompanyId"
      responses:
        "201":
          description: Convite criado
  /api/v1/invitations/accept:
    post:
      operationId: acceptInvitation
      summary: Aceita um convite vinculado ao e-mail autenticado
      responses:
        "200":
          description: Convite aceito
  /api/v1/invitations/{invitation_id}:
    delete:
      operationId: cancelInvitation
      summary: Cancela um convite pendente
      parameters:
        - $ref: "#/components/parameters/CompanyId"
        - name: invitation_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "204":
          description: Convite cancelado
  /api/v1/members:
    get:
      operationId: listMembers
      summary: Lista membros da empresa para Proprietários
      parameters:
        - $ref: "#/components/parameters/CompanyId"
      responses:
        "200":
          description: Membros da empresa
  /api/v1/members/{membership_id}:
    patch:
      operationId: updateMembership
      summary: Altera papel ou estado preservando um Proprietário ativo
      parameters:
        - $ref: "#/components/parameters/CompanyId"
        - name: membership_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Vínculo atualizado
  /api/v1/projects/{project_id}/access/{user_id}:
    put:
      operationId: grantProjectAccess
      summary: Concede acesso de projeto a um Administrador ativo
      parameters:
        - $ref: "#/components/parameters/CompanyId"
        - name: project_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: user_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "204":
          description: Acesso concedido
    delete:
      operationId: revokeProjectAccess
      summary: Revoga acesso de projeto de um Administrador
      parameters:
        - $ref: "#/components/parameters/CompanyId"
        - name: project_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: user_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "204":
          description: Acesso revogado
  /api/v1/clients:
    get:
      operationId: listClients
      summary: Lista clientes ativos da empresa selecionada
      parameters:
        - $ref: "#/components/parameters/CompanyId"
      responses:
        "200":
          description: Clientes disponíveis
    post:
      operationId: createClient
      summary: Cria um cliente na empresa selecionada
      parameters:
        - $ref: "#/components/parameters/CompanyId"
      responses:
        "201":
          description: Cliente criado
  /api/v1/projects:
    get:
      operationId: listProjects
      summary: Lista projetos acessíveis da empresa selecionada
      parameters:
        - $ref: "#/components/parameters/CompanyId"
      responses:
        "200":
          description: Projetos disponíveis
    post:
      operationId: createProject
      summary: Cria um projeto e concede acesso ao administrador criador
      parameters:
        - $ref: "#/components/parameters/CompanyId"
      responses:
        "201":
          description: Projeto criado
  /api/v1/media-files:
    get:
      operationId: listMediaFiles
      summary: Lista arquivos do catálogo acessíveis na empresa selecionada
      parameters:
        - $ref: "#/components/parameters/CompanyId"
        - name: q
          in: query
          schema: {type: string, maxLength: 200}
        - name: project_id
          in: query
          schema: {type: string, format: uuid}
        - name: status
          in: query
          schema: {type: string, maxLength: 40}
        - name: tag_id
          in: query
          schema: {type: string, format: uuid}
        - name: extension
          in: query
          schema: {type: string, maxLength: 32}
        - name: media_type
          in: query
          schema: {type: string, maxLength: 120}
        - name: min_size_bytes
          in: query
          schema: {type: integer, minimum: 0}
        - name: max_size_bytes
          in: query
          schema: {type: integer, minimum: 0}
        - name: recorded_from
          in: query
          schema: {type: string, format: date-time}
        - name: recorded_to
          in: query
          schema: {type: string, format: date-time}
        - name: created_by_user_id
          in: query
          schema: {type: string, format: uuid}
        - name: cursor
          in: query
          schema: {type: string, maxLength: 64}
        - name: limit
          in: query
          schema: {type: integer, minimum: 1, maximum: 100, default: 50}
      responses:
        "200":
          description: Arquivos acessíveis do catálogo
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MediaFileCollection"
    post:
      operationId: createMediaFile
      summary: Registra um arquivo lógico e sua primeira versão física
      parameters:
        - $ref: "#/components/parameters/CompanyId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateMediaFile"
      responses:
        "201":
          description: Arquivo registrado no catálogo
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MediaFile"
        "400":
          $ref: "#/components/responses/ValidationError"
  /api/v1/media-files/{media_file_id}:
    patch:
      operationId: updateMediaFileMetadata
      summary: Altera metadados funcionais com concorrência otimista
      parameters:
        - $ref: "#/components/parameters/CompanyId"
        - name: media_file_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateMediaMetadata"
      responses:
        "200":
          description: Metadados atualizados
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MediaFile"
        "409":
          description: Versão desatualizada
  /api/v1/media-files/{media_file_id}/metadata-history:
    get:
      operationId: listMediaMetadataHistory
      summary: Lista as versões funcionais de metadados acessíveis
      parameters:
        - $ref: "#/components/parameters/CompanyId"
        - name: media_file_id
          in: path
          required: true
          schema: {type: string, format: uuid}
        - name: after_version
          in: query
          schema: {type: integer, minimum: 0, default: 0}
        - name: limit
          in: query
          schema: {type: integer, minimum: 1, maximum: 100, default: 50}
      responses:
        "200":
          description: Histórico funcional do arquivo
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MetadataVersionCollection"
        "404": {description: Arquivo não encontrado no contexto autorizado}
  /api/v1/media-files/{media_file_id}/metadata-history/{version}/restore:
    post:
      operationId: restoreMediaMetadata
      summary: Restaura metadados como nova versão por um Proprietário
      parameters:
        - $ref: "#/components/parameters/CompanyId"
        - name: media_file_id
          in: path
          required: true
          schema: {type: string, format: uuid}
        - name: version
          in: path
          required: true
          schema: {type: integer, minimum: 1}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RestoreMetadata"
      responses:
        "200":
          description: Metadados restaurados ou já equivalentes
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MediaFile"
        "403": {description: Papel sem permissão para restaurar}
        "404": {description: Arquivo ou versão não encontrado}
        "409": {description: Versão atual desatualizada}
  /api/v1/tags:
    get:
      operationId: listTags
      summary: Lista tags genéricas e personalizadas disponíveis na empresa
      parameters:
        - $ref: "#/components/parameters/CompanyId"
      responses:
        "200":
          description: Tags disponíveis
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TagCollection"
    post:
      operationId: createCustomTag
      summary: Cria uma tag personalizada como Proprietário
      parameters:
        - $ref: "#/components/parameters/CompanyId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateTag"
      responses:
        "201":
          description: Tag personalizada criada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Tag"
        "403":
          description: Papel sem permissão para gerenciar tags
  /api/v1/tags/{tag_id}:
    delete:
      operationId: archiveCustomTag
      summary: Arquiva uma tag personalizada como Proprietário
      parameters:
        - $ref: "#/components/parameters/CompanyId"
        - name: tag_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "204":
          description: Tag arquivada
        "404":
          description: Tag personalizada não encontrada
  /api/v1/media-files/{media_file_id}/tags/{tag_id}:
    parameters:
      - $ref: "#/components/parameters/CompanyId"
      - name: media_file_id
        in: path
        required: true
        schema: {type: string, format: uuid}
      - name: tag_id
        in: path
        required: true
        schema: {type: string, format: uuid}
    put:
      operationId: assignMediaFileTag
      summary: Aplica uma tag a um arquivo acessível
      responses:
        "204": {description: Tag aplicada}
        "404": {description: Arquivo ou tag não encontrado}
    delete:
      operationId: removeMediaFileTag
      summary: Remove uma tag de um arquivo acessível
      responses:
        "204": {description: Tag removida}
        "404": {description: Arquivo não encontrado}
  /api/v1/agent/machines/heartbeat:
    post:
      operationId: recordMachineHeartbeat
      summary: Registra a máquina ou renova sua presença autenticada
      parameters:
        - $ref: "#/components/parameters/CompanyId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MachineHeartbeat"
      responses:
        "200":
          description: Presença registrada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Machine"
  /api/v1/agent/media-files:
    post:
      operationId: ingestAgentMediaFile
      summary: Registra de forma idempotente um arquivo organizado pelo agente
      parameters:
        - $ref: "#/components/parameters/CompanyId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/IngestAgentMediaFile"
      responses:
        "200":
          description: Ingestão existente devolvida sem duplicação
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MediaFile"
        "201":
          description: Arquivo registrado no catálogo
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MediaFile"
        "400":
          $ref: "#/components/responses/ValidationError"
        "404": {description: Máquina não encontrada no contexto autorizado}
        "409": {description: Identificador de ingestão usado com outros dados}
  /api/v1/agent/media-files/{media_file_id}/state:
    patch:
      operationId: reconcileMediaFileState
      summary: Reconcilia uma transição técnica confirmada pelo agente local
      parameters:
        - $ref: "#/components/parameters/CompanyId"
        - name: media_file_id
          in: path
          required: true
          schema: {type: string, format: uuid}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReconcileMediaFileState"
      responses:
        "200":
          description: Estado atual do arquivo, inclusive em repetição idempotente
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MediaFile"
        "400": {description: Transição técnica inválida}
        "404": {description: Arquivo ou máquina não encontrado no contexto autorizado}
        "409": {description: Versão do arquivo desatualizada}
  /api/v1/agent/commands:
    post:
      operationId: createAgentCommand
      summary: Persiste um comando idempotente destinado a uma máquina
      parameters:
        - $ref: "#/components/parameters/CompanyId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateAgentCommand"
      responses:
        "201":
          description: Comando criado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentCommand"
        "200":
          description: Comando idempotente já existente
        "409":
          description: Chave reutilizada com conteúdo diferente
  /api/v1/agent/commands/{command_id}:
    patch:
      operationId: updateAgentCommandState
      summary: Confirma recebimento, progresso ou resultado do comando
      parameters:
        - $ref: "#/components/parameters/CompanyId"
        - name: command_id
          in: path
          required: true
          schema: {type: string, format: uuid}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateAgentCommandState"
      responses:
        "200":
          description: Estado atualizado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentCommand"
        "400": {description: Transição inválida}
        "409": {description: Versão do comando desatualizada}
  /api/v1/agent/machines/{machine_id}/commands:
    get:
      operationId: listMachineCommands
      summary: Lista comandos persistidos pendentes da máquina
      parameters:
        - $ref: "#/components/parameters/CompanyId"
        - name: machine_id
          in: path
          required: true
          schema: {type: string, format: uuid}
        - name: after_sequence
          in: query
          schema: {type: integer, minimum: 0, default: 0}
        - name: limit
          in: query
          schema: {type: integer, minimum: 1, maximum: 100, default: 50}
      responses:
        "200":
          description: Comandos ainda executáveis
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentCommandCollection"
        "404":
          description: Máquina não encontrada na empresa
  /health/live:
    get:
      operationId: getLiveHealth
      summary: Verifica se o processo está ativo
      security: []
      responses:
        "200":
          description: Processo ativo
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LiveHealth"
  /health/ready:
    get:
      operationId: getReadinessHealth
      summary: Verifica dependências necessárias ao atendimento
      security: []
      responses:
        "200":
          description: Serviço pronto
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReadinessHealth"
        "503":
          description: Dependência indisponível
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReadinessHealth"
  /api/v1/me:
    get:
      operationId: getCurrentUser
      summary: Retorna a projeção do usuário autenticado
      security:
        - keycloak: []
      responses:
        "200":
          description: Usuário autenticado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CurrentUser"
        "401":
          $ref: "#/components/responses/AuthenticationRequired"
  /api/v1/companies:
    get:
      operationId: listCompanies
      summary: Lista empresas ativas do usuário
      security:
        - keycloak: []
      responses:
        "200":
          description: Empresas disponíveis
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CompanyCollection"
        "401":
          $ref: "#/components/responses/AuthenticationRequired"
    post:
      operationId: createCompany
      summary: Cria uma empresa e torna o usuário Proprietário
      security:
        - keycloak: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateCompany"
      responses:
        "201":
          description: Empresa criada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CompanyMembership"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/AuthenticationRequired"
components:
  parameters:
    CompanyId:
      name: X-Company-ID
      in: header
      required: true
      schema:
        type: string
        format: uuid
  securitySchemes:
    keycloak:
      type: openIdConnect
      openIdConnectUrl: http://127.0.0.1:8080/realms/legado/.well-known/openid-configuration
  responses:
    AuthenticationRequired:
      description: Autenticação necessária
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    ValidationError:
      description: Dados inválidos
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
  schemas:
    DriveAccount:
      type: object
      additionalProperties: false
      required: [connected, account_email, connected_at]
      properties:
        connected:
          type: boolean
        account_email:
          type: [string, "null"]
          format: email
        connected_at:
          type: [string, "null"]
          format: date-time
    DriveAuthorization:
      type: object
      additionalProperties: false
      required: [authorization_url]
      properties:
        authorization_url:
          type: string
          format: uri
    CreateMediaFile:
      type: object
      additionalProperties: false
      required:
        - project_id
        - original_name
        - size_bytes
        - checksum_algorithm
        - checksum_digest
      properties:
        project_id:
          type: string
          format: uuid
        original_name:
          type: string
          minLength: 1
          maxLength: 255
        media_type:
          type: string
          maxLength: 120
        size_bytes:
          type: integer
          minimum: 0
        checksum_algorithm:
          type: string
          maxLength: 24
        checksum_digest:
          type: string
          maxLength: 128
        recorded_at:
          type: [string, "null"]
          format: date-time
    IngestAgentMediaFile:
      type: object
      additionalProperties: false
      required:
        - project_id
        - machine_id
        - ingestion_id
        - original_name
        - size_bytes
        - checksum_algorithm
        - checksum_digest
      properties:
        project_id: {type: string, format: uuid}
        machine_id: {type: string, format: uuid}
        ingestion_id: {type: string, format: uuid}
        original_name: {type: string, minLength: 1, maxLength: 255}
        media_type: {type: string, maxLength: 120}
        size_bytes: {type: integer, minimum: 0}
        checksum_algorithm: {type: string, maxLength: 24}
        checksum_digest: {type: string, maxLength: 128}
        recorded_at: {type: [string, "null"], format: date-time}
    MediaFileCollection:
      type: object
      additionalProperties: false
      required: [items, next_cursor]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/MediaFile"
        next_cursor:
          type: [string, "null"]
    UpdateMediaMetadata:
      type: object
      additionalProperties: false
      required: [expected_version]
      properties:
        expected_version:
          type: integer
          minimum: 1
        display_name:
          type: string
          minLength: 1
          maxLength: 255
        description:
          type: string
        observations:
          type: string
        recorded_at:
          type: [string, "null"]
          format: date-time
    MediaFile:
      type: object
      additionalProperties: false
      required:
        - id
        - project_id
        - original_name
        - display_name
        - media_type
        - description
        - observations
        - size_bytes
        - checksum
        - recorded_at
        - status
        - version
        - tags
      properties:
        id:
          type: string
          format: uuid
        project_id:
          type: string
          format: uuid
        original_name:
          type: string
        display_name:
          type: string
        media_type:
          type: string
        description:
          type: string
        observations:
          type: string
        size_bytes:
          type: integer
          minimum: 0
        checksum:
          type: object
          additionalProperties: false
          required: [algorithm, digest]
          properties:
            algorithm:
              type: string
            digest:
              type: string
        recorded_at:
          type: [string, "null"]
          format: date-time
        status:
          type: string
          enum:
            - DESCOBERTO
            - ANALISADO
            - AGUARDANDO_CONFIRMACAO
            - ORGANIZANDO
            - ORGANIZADO
            - AGUARDANDO_UPLOAD
            - ENVIANDO
            - VERIFICANDO
            - SINCRONIZADO
            - CONFLITO
            - INTERROMPIDO
            - AGUARDANDO_INTERNET
            - DISPOSITIVO_DESCONECTADO
            - FALHA_DE_INTEGRIDADE
            - AGUARDANDO_INTERVENCAO
            - CANCELADO
        version:
          type: integer
          minimum: 1
        tags:
          type: array
          items:
            $ref: "#/components/schemas/Tag"
    RestoreMetadata:
      type: object
      additionalProperties: false
      required: [expected_version]
      properties:
        expected_version: {type: integer, minimum: 1}
    MetadataVersionCollection:
      type: object
      additionalProperties: false
      required: [items, next_version]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/MetadataVersion"
        next_version:
          type: [integer, "null"]
          minimum: 1
    MetadataVersion:
      type: object
      additionalProperties: false
      required: [version, actor_user_id, snapshot, created_at]
      properties:
